name: 🧪 Continuous Integration

on:
  push:
  pull_request:

jobs:
  test:
    name: 🧪 Plugin test
    # The Music bridge is a Swift program, so the plugin can only be built on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Run linter
        run: npx eslint

      - name: 🔎 Check types
        run: npm run typecheck

      - name: 🧪 Run tests with coverage
        run: npm run test:coverage

      - name: 🧪 Run Music bridge tests
        run: npm run test:native

      - name: 📦 Pack plugin (smoke test)
        run: |
          npm run build
          npx streamdeck validate studio.wenoa.applemusic.sdPlugin
          npm run pack

  release:
    name: 🚀 Release
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: fregante/setup-git-user@v2

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: 🏷️ Set up git-mkver
        uses: cperezabo/setup-git-mkver@v1.2.0
        with:
          version: 1.3.0

      - name: 📝 Update version in files
        run: git-mkver patch

      - name: 📦 Update package-lock.json
        run: npm install

      - name: 🔢 Get version
        id: version
        run: |
          echo "version=$(git mkver next)" >> $GITHUB_OUTPUT

      - name: 💾 Commit version
        run: |
          git add .
          git commit -m "chore: version update"
          git mkver tag
          git push && git push --tags

      - name: 📦 Final build
        run: |
          npm run build
          npm run pack

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: studio.wenoa.applemusic.streamDeckPlugin
          draft: false
          prerelease: false
