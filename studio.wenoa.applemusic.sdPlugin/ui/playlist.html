<!DOCTYPE html>
<html lang="en">

<head>
  <title>Playlist Settings</title>
  <meta charset="utf-8" />
  <script src="../bin/sdpi-components.js"></script>
  <script>
    SDPIComponents.i18n.locales = {
      en: {
        playlist: "Playlist",
        choose: "Choose a playlist",
      },
      es: {
        playlist: "Playlist",

</body>

</html>
